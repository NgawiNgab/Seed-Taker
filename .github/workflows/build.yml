name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      # Cheap pre-flight (F-095): the NDK build uses libc++, whose headers
      # leak less transitively than libstdc++. A header that leans on a
      # transitive <cstdint> -> std::size_t compiles on a dev host and fails
      # here. These two scripts are pure host-side checks (no NDK needed) and
      # catch that class before the expensive build runs.
      - name: Host checklist
        run: |
          bash tools/hostgate/selfcontained.sh
          bash tools/hostgate/gate.sh

      - name: Build and package
        run: |
          xmake f -y -p android -a arm64-v8a -m release --ndk=${{ steps.ndk.outputs.ndk-path }}
          xmake -y

      - uses: actions/upload-artifact@v4
        with:
          name: SeedTaker-levipack
          path: build/android/arm64-v8a/release/SeedTaker.levipack
          if-no-files-found: error
